pipeline: ai-video
version: 0.1
stages:
  - id: script
    agent: visual-storyteller        # 创意层角色
    input:  user_brief.md            # 用户选题/方向/关键剧情点
    output: storyboard.json
    gate: script-review              # 验收：双 agent 互评
  - id: image
    agent: image-prompt-engineer
    input: storyboard.json
    output: frames/ + char_bible.json
    gate: vlm-review
  - id: character
    agent: narrative-designer
    input: frames/ + char_bible.json
    output: char_pack/ (圣经+定妆图+ref2va参考图)
    gate: consistency-check
  - id: video
    agent: orchestration            # opencode 编排，调 make-video.ts
    input:  char_pack/ + storyboard.json
    output: clips/*.mp4
    gate: vision-audit (>=70, 自动重跑)
  - id: overlay
    agent: orchestration            # scripts/render_overlays.py：pil/hyperframes/remotion
    input:  storyboard.json + clips/
    output: overlays/               # 每个 shot 的 overlay 字段 + 顶层 overlays 列表 → output/overlays/
    gate: overlay-render (provider 可用且产物非空)
    options:
      default_engine: pil          # 兜底；hyperframes 不可用时自动降级
      engines: [pil, hyperframes, remotion]
  - id: audio
    agent: orchestration            # edge-tts 配音 + BGM + 字幕 + 混音
    input: storyboard.json + clips/ + overlays/
    output: final.mp4
    gate: audio-check (时长/响度/音画同步)
  - id: final
    agent: short-video-editing-coach
    input: final.mp4
    output: acceptance.md
    gate: content-rules
artifacts:
  root: D:\ai-video-pipeline\output\
  layout: {storyboard: sb/, frames: frames/, char_pack: char/, clips: clips/, overlays: overlays/, final: out/}