<!--
  overlays/transition.html — 镜头转场（全屏闪白/闪黑 + 文字提示）
  ----------------------------------------------------------------
  HyperFrames HTML 模板。需 `hyperframes` CLI。

  data 字段：
    {{label}}      转场标签（可选），居中显示文字。例：「NEXT」/「— · —」
    {{style}}      转场风格（可选），可选值：fade / flash / glitch，默认 fade
    __DURATION__   时长（秒）。转场建议 0.6 - 1.5s。
    __WIDTH__ / __HEIGHT__  画布尺寸，自动写入。

  怎么改样式：
    - 默认黑色帘幕。改成白色帘幕就把 .wipe 的 background 改成 #fff。
    - 调整 .wipe / .label 的 animation 时长或方向。
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>transition</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: __WIDTH__px;
        height: __HEIGHT__px;
        overflow: hidden;
        background: transparent;
        font-family: "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .stage { position: absolute; inset: 0; }
      .wipe {
        position: absolute;
        inset: 0;
        background: #000;
        transform: scaleX(0);
        transform-origin: left center;
      }
      .label {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #f5f5f5;
        font-size: 56px;
        letter-spacing: 0.4em;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="stage"
      data-composition-id="main"
      data-start="0"
      data-duration="__DURATION__"
      data-width="__WIDTH__"
      data-height="__HEIGHT__"
    >
      <div class="wipe"></div>
      <div class="label">{{label}}</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to(".wipe", { scaleX: 1, duration: 0.45, ease: "power2.in" }, 0)
        .to(".label", { opacity: 1, duration: 0.2 }, 0.25)
        .to(".wipe", { scaleX: 0, transformOrigin: "right center", duration: 0.5, ease: "power2.out" }, 0.5)
        .to(".label", { opacity: 0, duration: 0.2 }, 0.95);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
