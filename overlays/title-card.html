<!--
  overlays/title-card.html — 片头标题卡
  ----------------------------------------------------------------
  HyperFrames HTML 模板（agent 友好）。需要 `hyperframes` CLI（>=0.7.x）。

  data 字段（data-* 属性里写 __KEY__，或者正文里写 {{key}}）：
    {{title}}      主标题（必填）  例：「城市最后一班电车」
    {{subtitle}}   副标题（可选）  例：「Episode 01」
    {{tagline}}    小字标语（可选）  例：「献给每个深夜还没睡的人」
    __DURATION__   时长（秒），由 render_overlays.py 自动写入，建议 >= 3
    __WIDTH__      画布宽（默认 1920），自动写入
    __HEIGHT__     画布高（默认 1080），自动写入

  怎么改样式：
    - 颜色：改 .stage 背景、.title 文字 color、.accent-bar 的 background。
    - 动画：调整 window.__timelines["main"] 里 GSAP timeline 的 from / to 参数。
    - 字体：把 body { font-family: ... } 换成你想要的 font-family，或引入 Google Fonts。
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>{{title}}</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: __WIDTH__px;
        height: __HEIGHT__px;
        overflow: hidden;
        background: #050505;
        font-family: "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #f5f5f5;
      }
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: 0 12%;
      }
      .accent-bar {
        width: 140px;
        height: 6px;
        background: #ffb35a;
        margin-bottom: 36px;
        opacity: 0;
      }
      .title {
        font-size: 120px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: 0.02em;
        opacity: 0;
        transform: translateY(40px);
      }
      .subtitle {
        margin-top: 24px;
        font-size: 36px;
        font-weight: 400;
        color: #cfcfcf;
        opacity: 0;
        transform: translateY(20px);
      }
      .tagline {
        position: absolute;
        bottom: 8%;
        left: 12%;
        font-size: 22px;
        color: #8a8a8a;
        letter-spacing: 0.4em;
        opacity: 0;
      }
      .bg-vignette {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 70% 50%, rgba(255, 179, 90, 0.18), transparent 60%),
          linear-gradient(180deg, #0a0a0a 0%, #1a1a1a 100%);
      }
    </style>
  </head>
  <body>
    <div class="bg-vignette"></div>
    <div
      id="root"
      class="stage"
      data-composition-id="main"
      data-start="0"
      data-duration="__DURATION__"
      data-width="__WIDTH__"
      data-height="__HEIGHT__"
    >
      <div class="accent-bar"></div>
      <h1 class="title">{{title}}</h1>
      <h2 class="subtitle">{{subtitle}}</h2>
    </div>
    <div class="tagline">{{tagline}}</div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to(".accent-bar", { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.2)
        .to(".title", { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.4)
        .to(".subtitle", { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.9)
        .to(".tagline", { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.6);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
